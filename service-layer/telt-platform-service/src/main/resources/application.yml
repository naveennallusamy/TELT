spring:
  application:
    name: telt-platform-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/TELT}
    username: ${DB_USERNAME:telt_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:5050}
  servlet:
    context-path: /telt/api

management:
  endpoints:
    web:
      exposure:
        include: health,info

telt:
  security:
    jwt:
      issuer: ${JWT_ISSUER:telt-platform}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      # PEM file locations (e.g. file:/run/secrets/jwt-private.pem). Blank => ephemeral dev key pair.
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  account:
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    password-reset-ttl: ${PASSWORD_RESET_TTL:1h}
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lockout-duration: ${LOCKOUT_DURATION:15m}
    mail-from: ${MAIL_FROM:no-reply@telt.local}
  bootstrap:
    super-admin:
      username: ${TELT_ADMIN_USERNAME:teltadmin}
      email: ${TELT_ADMIN_EMAIL:}
      mobile-number: ${TELT_ADMIN_MOBILE:}
      password: ${TELT_ADMIN_PASSWORD:}
